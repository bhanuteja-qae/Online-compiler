name: test

on:
  push:
  pull_request:

jobs:
  tracer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python tests/test_tracer.py
      - run: python tests/test_problems.py
      - run: node --check app.js && node --check viz.js && node --check worker.js && node --check patterns.js && node --check problems.js
